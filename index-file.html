<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hollow Knight</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/TemplateData/style.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #231f20;
        }

        #loading-text {
            position: fixed;
            inset: 20px 0 auto;
            z-index: 10;
            color: white;
            font: 32px Arial, sans-serif;
            text-align: center;
            pointer-events: none;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="loading-text">LOADING...</div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-mobile-warning">
            WebGL builds are not supported on mobile devices.
        </div>
    </div>

    <script>
        (() => {
            "use strict";

            // Local file:// launcher. The HTML is local, while all Unity
            // assets are fetched from jsDelivr.
            const CDN_URL =
                "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/";
            const BUILD_URL = `${CDN_URL}Build/`;

            // Alternate CDN/origin endpoints used only when the primary
            // jsDelivr endpoint temporarily returns an error.
            const FALLBACK_BUILD_URLS = [
                "https://fastly.jsdelivr.net/gh/web-ports/hollow-knight@latest/Build/",
                "https://raw.githubusercontent.com/web-ports/hollow-knight/main/Build/"
            ];

            // These must match the filenames before ".partN" in the repository.
            const DATA_FILE = "Glitches HK.data";
            const WASM_FILE = "Glitches HK.wasm";
            const DATA_PARTS = 42;
            const WASM_PARTS = 2;

            const LOADER_URL = `${BUILD_URL}Glitches%20HK.loader.js`;
            const FRAMEWORK_URL = `${BUILD_URL}Glitches%20HK.framework.js`;

            const loadingText = document.getElementById("loading-text");
            const container = document.getElementById("unity-container");
            const canvas = document.getElementById("unity-canvas");
            const loadingBar = document.getElementById("unity-loading-bar");
            const progressBar = document.getElementById("unity-progress-bar-full");
            const mobileWarning = document.getElementById("unity-mobile-warning");

            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            function setLoadingText(message) {
                loadingText.textContent = message;
            }

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    script.src = src;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = () =>
                        reject(new Error(`Could not load Unity loader: ${src}`));
                    document.head.appendChild(script);
                });
            }

            // -------- 75% internal rendering resolution --------
            const RENDER_SCALE = 0.75;

            function setupResolutionScale() {
                const targetCanvas = canvas;

                if (!targetCanvas) {
                    console.warn("Canvas not found");
                    return;
                }

                const resize = () => {
                    const width = window.innerWidth;
                    const height = window.innerHeight;

                    targetCanvas.width = Math.max(1, Math.floor(width * RENDER_SCALE));
                    targetCanvas.height = Math.max(1, Math.floor(height * RENDER_SCALE));

                    // Keep the game visually fullscreen.
                    targetCanvas.style.width = width + "px";
                    targetCanvas.style.height = height + "px";
                };

                resize();
                window.addEventListener("resize", resize);
            }

            // -------- Reliable split-file downloader --------
            // Downloads remain sequential, matching your working version,
            // but transient CDN failures are retried and alternate endpoints
            // are attempted before the loader gives up.
            const MAX_RETRIES = 5;
            const RETRY_BASE_MS = 1500;

            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            function makePartUrlCandidates(file, partNumber) {
                const encodedFile = encodeURIComponent(file);

                return [
                    `${BUILD_URL}${encodedFile}.part${partNumber}`,
                    ...FALLBACK_BUILD_URLS.map(
                        base => `${base}${encodedFile}.part${partNumber}`
                    )
                ];
            }

            async function fetchPartWithRetry(urls, label, partNumber, count) {
                let lastError = null;

                for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                    setLoadingText(
                        `LOADING ${label}... part ${partNumber}/${count}` +
                        (attempt ? ` (retry ${attempt}/${MAX_RETRIES - 1})` : "")
                    );

                    for (const url of urls) {
                        try {
                            const response = await fetch(url, {
                                cache: "no-store",
                                mode: "cors"
                            });

                            if (response.ok) {
                                return new Uint8Array(await response.arrayBuffer());
                            }

                            const status = response.status;
                            lastError = new Error(`HTTP ${status}`);

                            console.warn(
                                `${label} part ${partNumber}/${count}: ${status} from ${url}`
                            );

                            // A 404 generally means the file is genuinely absent
                            // at this endpoint, so immediately test the next one.
                            // 403/429/5xx are treated as transient CDN failures.
                            if (![403, 408, 425, 429, 500, 502, 503, 504].includes(status)) {
                                continue;
                            }
                        } catch (error) {
                            lastError = error instanceof Error
                                ? error
                                : new Error(String(error));

                            console.warn(
                                `${label} part ${partNumber}/${count}: network error from ${url}`,
                                lastError
                            );
                        }
                    }

                    if (attempt < MAX_RETRIES - 1) {
                        const delay = Math.min(
                            RETRY_BASE_MS * (2 ** attempt),
                            16000
                        );

                        setLoadingText(
                            `RETRYING ${label} part ${partNumber}/${count} in ` +
                            `${Math.ceil(delay / 1000)}s...`
                        );

                        await sleep(delay);
                    }
                }

                throw new Error(
                    `${label} part ${partNumber}/${count} failed after ${MAX_RETRIES} attempts. ` +
                    `Last error: ${lastError ? lastError.message : "unknown error"}`
                );
            }

            async function downloadSplitFile(file, count, label) {
                const parts = [];
                let totalBytes = 0;

                for (let i = 0; i < count; i++) {
                    const n = i + 1;
                    const urls = makePartUrlCandidates(file, n);

                    const bytes = await fetchPartWithRetry(
                        urls,
                        label,
                        n,
                        count
                    );

                    parts.push(bytes);
                    totalBytes += bytes.byteLength;

                    setLoadingText(
                        `LOADING ${label}... ${Math.round(n / count * 100)}% (${n}/${count})`
                    );
                }

                const blob = new Blob(parts, {
                    type: label === "WASM"
                        ? "application/wasm"
                        : "application/octet-stream"
                });

                return {
                    url: URL.createObjectURL(blob),
                    size: totalBytes
                };
            }

            function configureCanvas() {
                // Keep CSS fullscreen; Unity receives the rendering scale through
                // devicePixelRatio below. Do not overwrite the 75% canvas here.
                canvas.style.width = "100vw";
                canvas.style.height = "100vh";
            }

            async function startGame() {
                container.hidden = false;
                loadingBar.style.display = "block";

                if (isMobile) {
                    container.className = "unity-mobile";
                    mobileWarning.style.display = "block";
                }

                configureCanvas();
                setupResolutionScale();

                setLoadingText("PREPARING GAME DATA...");
                const dataAsset = await downloadSplitFile(
                    DATA_FILE, DATA_PARTS, "DATA"
                );

                setLoadingText("PREPARING GAME CODE...");
                const wasmAsset = await downloadSplitFile(
                    WASM_FILE, WASM_PARTS, "WASM"
                );

                setLoadingText("LOADING UNITY ENGINE...");
                await loadScript(LOADER_URL);

                if (typeof window.createUnityInstance !== "function") {
                    throw new Error(
                        "Unity loader loaded, but createUnityInstance() was not found."
                    );
                }

                const config = {
                    dataUrl: dataAsset.url,
                    frameworkUrl: FRAMEWORK_URL,
                    codeUrl: wasmAsset.url,
                    streamingAssetsUrl: `${CDN_URL}StreamingAssets`,
                    companyName: "Stratus Dev Ports",
                    productName: "Hollow Knight",
                    productVersion: "Perfect Port",
                    devicePixelRatio: isMobile ? 1 : RENDER_SCALE
                };

                setLoadingText("STARTING UNITY...");

                window.unityInstance = await createUnityInstance(
                    canvas,
                    config,
                    progress => {
                        const percent = Math.round(progress * 100);
                        progressBar.style.width = `${percent}%`;
                        setLoadingText(`LOADING... ${percent}%`);
                    }
                );

                loadingText.remove();
                loadingBar.style.display = "none";

                // Keep these URLs alive because Unity still references them.
                window.__unityDataBlobUrl = dataAsset.url;
                window.__unityWasmBlobUrl = wasmAsset.url;
            }

            startGame().catch(error => {
                console.error("Game startup failed:", error);
                loadingBar.style.display = "none";
                setLoadingText(`ERROR: ${error.message}`);
            });
        })();
    </script>
</body>
</html>
