<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/Re1muri/hollowknight@latest/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hollow Knight</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #231f20;
        }

        #loading-text {
            position: fixed;
            inset: 20px 0 auto;
            z-index: 10;
            color: white;
            font: 32px Arial, sans-serif;
            text-align: center;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="loading-text">LOADING...</div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-mobile-warning">
            WebGL builds are not supported on mobile devices.
        </div>
    </div>

    <script>
        (() => {
            "use strict";

            const CDN_URL = "https://cdn.jsdelivr.net/gh/Re1muri/hollowknight@latest/";
            const BUILD_URL = "Build";
            const CDN_BUILD_URL = `${CDN_URL}Build`;
            const LOADER_URL = `${CDN_BUILD_URL}/Glitches HK.loader.js`;
            // Keep the worker on this site; the <base> tag is only for game assets.
            const SERVICE_WORKER_URL = new URL("asset-streamer-sw.js", location.href).href;
            const SERVICE_WORKER_SCOPE = new URL("./", location.href).pathname;

            const loadingText = document.getElementById("loading-text");
            const container = document.getElementById("unity-container");
            const canvas = document.getElementById("unity-canvas");
            const loadingBar = document.getElementById("unity-loading-bar");
            const progressBar = document.getElementById("unity-progress-bar-full");
            const mobileWarning = document.getElementById("unity-mobile-warning");

            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            function setLoadingText(message) {
                loadingText.textContent = message;
            }

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    script.src = src;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`Could not load ${src}`));
                    document.body.appendChild(script);
                });
            }

            async function installAndWaitForWorker() {
                if (location.protocol !== "https:" && location.hostname !== "localhost"
                    && location.hostname !== "127.0.0.1") {
                    throw new Error(
                        "Open this game from an HTTPS website or localhost. " +
                        "Service workers do not work from file://."
                    );
                }

                if (!("serviceWorker" in navigator)) {
                    throw new Error("This browser does not support service workers.");
                }

                await navigator.serviceWorker.register(SERVICE_WORKER_URL, {
                    scope: SERVICE_WORKER_SCOPE
                });

                await navigator.serviceWorker.ready;

                if (navigator.serviceWorker.controller) {
                    return;
                }

                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error("The asset streaming worker did not take control."));
                    }, 10000);

                    navigator.serviceWorker.addEventListener(
                        "controllerchange",
                        () => {
                            clearTimeout(timeout);
                            resolve();
                        },
                        { once: true }
                    );
                });
            }

            async function startGame() {
                setLoadingText("Preparing game files...");
                await installAndWaitForWorker();

                if (isMobile) {
                    container.className = "unity-mobile";
                    mobileWarning.style.display = "block";
                }

                const config = {
                    dataUrl: `${BUILD_URL}/Glitches HK.data`,
                    frameworkUrl: `${CDN_BUILD_URL}/Glitches HK.framework.js`,
                    codeUrl: `${BUILD_URL}/Glitches HK.wasm`,
                    streamingAssetsUrl: `${CDN_URL}StreamingAssets`,
                    companyName: "Stratus Dev Ports",
                    productName: "Hollow Knight",
                    productVersion: "Perfect Port",
                    devicePixelRatio: isMobile
                        ? 1
                        : Math.min(window.devicePixelRatio || 1, 1.5)
                };

                await loadScript(LOADER_URL);
                loadingBar.style.display = "block";

                window.unityInstance = await createUnityInstance(
                    canvas,
                    config,
                    progress => {
                        progressBar.style.width = `${progress * 100}%`;
                        setLoadingText(`LOADING... ${Math.round(progress * 100)}%`);
                    }
                );

                loadingText.remove();
                loadingBar.style.display = "none";
            }

            startGame().catch(error => {
                console.error("Game startup failed:", error);
                setLoadingText(`ERROR: ${error.message}`);
            });
        })();
    </script>
</body>
</html>
